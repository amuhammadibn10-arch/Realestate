<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--card:#171f2f;--tx:#e8ecf4;--mu:#93a0b8;--bd:#273148;--ac:#5b8cff;--g:#4ade80;--r:#f87171;--o:#fbbf24;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1420;--card:#171f2f;--tx:#e8ecf4;--mu:#93a0b8;--bd:#273148;--ac:#5b8cff;--g:#4ade80;--r:#f87171;--o:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:19px;margin:0}h1 b{color:var(--ac)}h3{margin:0 0 8px;font-size:15px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 18px}nav button{white-space:nowrap}
button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;text-decoration:none}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:0 18px 30px;align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
input,select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k div{background:var(--bg);border-radius:10px;padding:10px}.k small{color:var(--mu);display:block}.k b{font-size:18px}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto;max-height:420px}.note{color:var(--mu);font-size:12px}.pos{color:var(--g)}.neg{color:var(--r)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);color:var(--o)}
svg{width:100%;height:auto}
@media print{nav,header button,#side,.noprint{display:none!important}.wrap{display:block}}
</style></head><body>
